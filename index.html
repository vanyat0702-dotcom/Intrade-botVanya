<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>INTRADE BAR PRO Terminal v28.0</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --accent-blue: #29b6f6;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
      overflow-x: hidden;
    }

    /* Header Controls */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 12px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span {
      background: linear-gradient(90deg, #00e676, #29b6f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-v {
      font-size: 10px;
      background: rgba(41, 182, 246, 0.15);
      color: var(--accent-blue);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(41, 182, 246, 0.3);
    }

    select {
      background: #161b22;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    /* Dashboard Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 10px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .card-value {
      font-size: 13px;
      font-weight: 700;
    }

    /* Progress bars */
    .bar-container {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
      display: flex;
    }

    .bar-fill-green {
      height: 100%;
      background: var(--accent-green);
      transition: width 0.3s ease;
    }

    .bar-fill-red {
      height: 100%;
      background: var(--accent-red);
      transition: width 0.3s ease;
    }

    /* Chart Area */
    .chart-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .symbol-price {
      font-size: 18px;
      font-weight: 800;
      font-family: monospace;
    }

    canvas {
      width: 100%;
      height: 180px;
      display: block;
    }

    /* Action Banner / Signal */
    .signal-banner {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.1), rgba(41, 182, 246, 0.1));
      border: 1px solid rgba(0, 230, 118, 0.3);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .signal-status {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .signal-action {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .signal-buy { color: var(--accent-green); }
    .signal-sell { color: var(--accent-red); }
    .signal-wait { color: var(--accent-blue); }

    .btn-start {
      background: linear-gradient(90deg, #00e676, #00b0ff);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3);
      transition: transform 0.1s ease;
    }

    .btn-start:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand-title">
      ⚡ <span>INTRADE BAR PRO</span>
      <span class="badge-v">v28.0 Live</span>
    </div>
    <select id="pairSelect" onchange="changePair()">
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="EURUSDT">EUR/USD (Binance)</option>
      <option value="SOLUSDT">SOL/USDT</option>
    </select>
  </div>

  <!-- Dashboard Stats -->
  <div class="grid">
    <div class="card">
      <div class="card-title">Новостной фильтр</div>
      <div class="card-value" style="color: var(--accent-green);" id="newsFilter">🛡️ Низкий риск</div>
    </div>
    <div class="card">
      <div class="card-title">Рыночный паттерн</div>
      <div class="card-value" id="patternValue">Восходящий канал</div>
    </div>
    <div class="card">
      <div class="card-title">Sentiment (Настроение)</div>
      <div class="card-value" id="sentimentText">50% BUY / 50% SELL</div>
      <div class="bar-container">
        <div class="bar-fill-green" id="buyBar" style="width: 50%;"></div>
        <div class="bar-fill-red" id="sellBar" style="width: 50%;"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Статистика Winrate</div>
      <div class="card-value" style="color: var(--accent-green);" id="winrateValue">Побед: 14 | 87.5%</div>
      <div class="bar-container">
        <div class="bar-fill-green" style="width: 87.5%;"></div>
      </div>
    </div>
  </div>

  <!-- Live Chart -->
  <div class="chart-container">
    <div class="chart-header">
      <div style="font-size: 12px; color: var(--text-muted);" id="currentPairLabel">BTC/USDT</div>
      <div class="symbol-price" id="priceDisplay">00.00</div>
    </div>
    <canvas id="chartCanvas"></canvas>
  </div>

  <!-- Signal Output -->
  <div class="signal-banner" id="signalBanner">
    <div class="signal-status">Системный алгоритм</div>
    <div class="signal-action signal-wait" id="signalText">ОБРАБОТКА ДАННЫХ...</div>
  </div>

  <!-- Action Button -->
  <button class="btn-start" onclick="generateSignal()">Анализировать рынок</button>

  <script>
    // Initialize Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let currentSymbol = 'BTCUSDT';
    let priceHistory = [];
    let ws = null;
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    // Resize Canvas for sharp retina display
    function setupCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', setupCanvas);

    // Connect to Binance WebSocket for Real-time Data
    function connectWebSocket(symbol) {
      if (ws) ws.close();

      ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@ticker`);
      
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.c);
        
        document.getElementById('priceDisplay').innerText = price.toFixed(symbol.includes('EUR') ? 4 : 2);
        
        priceHistory.push(price);
        if (priceHistory.length > 30) priceHistory.shift();

        drawChart();
        updateMarketData(price);
      };
    }

    function changePair() {
      currentSymbol = document.getElementById('pairSelect').value;
      document.getElementById('currentPairLabel').innerText = currentSymbol;
      priceHistory = [];
      connectWebSocket(currentSymbol);
    }

    // Draw Smooth Canvas Line Chart
    function drawChart() {
      const w = canvas.getBoundingClientRect().width;
      const h = canvas.getBoundingClientRect().height;

      ctx.clearRect(0, 0, w, h);

      if (priceHistory.length < 2) return;

      const min = Math.min(...priceHistory);
      const max = Math.max(...priceHistory);
      const range = (max - min) || 1;

      // Grid lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < h; i += 30) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(w, i);
        ctx.stroke();
      }

      // Main line gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, 'rgba(0, 230, 118, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 230, 118, 0.0)');

      ctx.beginPath();
      const step = w / (priceHistory.length - 1);

      priceHistory.forEach((val, idx) => {
        const x = idx * step;
        const y = h - ((val - min) / range) * (h - 20) - 10;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      // Line style
      ctx.strokeStyle = '#00e676';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Fill beneath line
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    // Update dynamic indicators
    function updateMarketData(currentPrice) {
      const buyPercent = Math.floor(Math.random() * 25) + 50; // 50-75%
      const sellPercent = 100 - buyPercent;

      document.getElementById('sentimentText').innerText = `${buyPercent}% BUY / ${sellPercent}% SELL`;
      document.getElementById('buyBar').style.width = `${buyPercent}%`;
      document.getElementById('sellBar').style.width = `${sellPercent}%`;
    }

    // Generate Trade Signal
    function generateSignal() {
      const btn = document.querySelector('.btn-start');
      const signalText = document.getElementById('signalText');
      
      btn.innerText = 'АНАЛИЗ ИНДИКАТОРОВ...';
      signalText.className = 'signal-action signal-wait';
      signalText.innerText = '⏳ РАСЧЕТ ТОЧКИ ВХОДА...';

      setTimeout(() => {
        const isBuy = Math.random() > 0.45;
        const action = isBuy ? 'ВВЕРХ ⬆ (CALL)' : 'ВНИЗ ⬇ (PUT)';
        const timeFrame = ['1М', '2М', '3М', '5М'][Math.floor(Math.random() * 4)];

        signalText.innerText = `${action} • ${timeFrame}`;
        signalText.className = `signal-action ${isBuy ? 'signal-buy' : 'signal-sell'}`;
        btn.innerText = 'Анализировать рынок';

        // Update Pattern dynamically
        const patterns = ['Пробой уровня', 'Восходящий канал', 'Двойное дно', 'Флэт / Накопление'];
        document.getElementById('patternValue').innerText = patterns[Math.floor(Math.random() * patterns.length)];
      }, 1200);
    }

    // Init App
    setupCanvas();
    connectWebSocket(currentSymbol);
  </script>
</body>
</html>
