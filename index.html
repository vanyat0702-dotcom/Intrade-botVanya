<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Intrade Bar Pro Terminal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05070e;
      --card-bg: rgba(13, 17, 39, 0.85);
      --card-border: rgba(0, 240, 255, 0.2);
      --neon-cyan: #00f0ff;
      --neon-green: #00ff66;
      --neon-red: #ff0055;
      --neon-purple: #7000ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.2), transparent 70%),
        radial-gradient(circle at 0% 100%, rgba(0, 240, 255, 0.15), transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 14px;
      color: #000;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .brand-title span {
      color: var(--neon-cyan);
    }

    select {
      background: rgba(5, 7, 14, 0.9);
      color: var(--neon-cyan);
      border: 1px solid var(--card-border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      outline: none;
    }

    .controls-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .tf-selector {
      display: flex;
      background: rgba(0,0,0,0.5);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .tf-btn {
      padding: 5px 12px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tf-btn.active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .tools-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tools-scroll::-webkit-scrollbar { display: none; }

    .tool-chip {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--card-border);
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 10px;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .tool-chip.active {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(0, 255, 102, 0.1);
    }

    .chart-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
    }

    .chart-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pair-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .payout-badge {
      font-size: 10px;
      background: rgba(0, 255, 102, 0.15);
      color: var(--neon-green);
      border: 1px solid var(--neon-green);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .price-value {
      font-family: monospace;
      font-size: 16px;
      font-weight: 800;
      color: var(--neon-cyan);
    }

    canvas {
      width: 100%;
      height: 220px;
      display: block;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.1);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 9px 11px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .stat-title {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 12px;
      font-weight: 700;
    }

    .signal-box {
      background: linear-gradient(135deg, rgba(112, 0, 255, 0.2), rgba(0, 240, 255, 0.2));
      border: 1px solid var(--neon-cyan);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
    }

    .signal-title {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .signal-main {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .signal-buy { color: var(--neon-green); text-shadow: 0 0 12px rgba(0,255,102,0.6); }
    .signal-sell { color: var(--neon-red); text-shadow: 0 0 12px rgba(255,0,85,0.6); }
    .signal-wait { color: var(--neon-cyan); }

    .btn-action {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-logo">IB</div>
      <div class="brand-title">INTRADE BAR <span>PRO</span></div>
    </div>
    <select id="assetSelect" onchange="changeAsset()">
      <optgroup label="Intrade Bar OTC (85%)">
        <option value="EURUSD_OTC">EUR/USD OTC (85%)</option>
        <option value="GBPUSD_OTC">GBP/USD OTC (85%)</option>
        <option value="USDJPY_OTC">USD/JPY OTC (85%)</option>
        <option value="AUDUSD_OTC">AUD/USD OTC (85%)</option>
      </optgroup>
      <optgroup label="Forex Live">
        <option value="EURUSD">EUR/USD (82%)</option>
        <option value="GBPUSD">GBP/USD (80%)</option>
        <option value="USDJPY">USD/JPY (82%)</option>
      </optgroup>
      <optgroup label="Crypto">
        <option value="BTCUSDT">BTC/USDT (85%)</option>
        <option value="ETHUSDT">ETH/USDT (85%)</option>
      </optgroup>
    </select>
  </div>

  <div class="controls-panel">
    <div class="panel-row">
      <span style="font-size: 11px; color: var(--text-muted); font-weight:600;">Таймфрейм:</span>
      <div class="tf-selector">
        <button class="tf-btn" onclick="setTF('1M', this)">1M</button>
        <button class="tf-btn active" onclick="setTF('5M', this)">5M</button>
        <button class="tf-btn" onclick="setTF('15M', this)">15M</button>
      </div>
    </div>
    <div class="tools-scroll">
      <div class="tool-chip active" onclick="toggleTool(this)"><span>✓</span> RSI (14)</div>
      <div class="tool-chip active" onclick="toggleTool(this)"><span>✓</span> MACD</div>
      <div class="tool-chip active" onclick="toggleTool(this)"><span>✓</span> Bollinger Bands</div>
      <div class="tool-chip active" onclick="toggleTool(this)"><span>✓</span> S/R Уровни</div>
      <div class="tool-chip active" onclick="toggleTool(this)"><span>✓</span> Тренд-Фильтр</div>
    </div>
  </div>

  <div class="chart-card">
    <div class="chart-info">
      <div>
        <span class="pair-name" id="pairLabel">EUR/USD</span>
        <span class="payout-badge" id="payoutBadge">85%</span>
      </div>
      <div class="price-value" id="priceDisplay">1.08542</div>
    </div>
    <canvas id="candleCanvas"></canvas>
  </div>

  <div class="grid-2">
    <div class="stat-card">
      <div class="stat-title">Паттерн рынка</div>
      <div class="stat-val" style="color: var(--neon-cyan);" id="patternText">Бычье поглощение</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Волатильность</div>
      <div class="stat-val" style="color: var(--neon-green);">Оптимальная (Безопасно)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Новостной фильтр</div>
      <div class="stat-val" style="color: var(--neon-green);">🛡️ Тихо (Нет новостей)</div>
    </div>
    <div class="stat-card">
      <div class="stat-title">Winrate Алгоритма</div>
      <div class="stat-val" style="color: var(--neon-green);">88.4% (42/47 W)</div>
    </div>
  </div>

  <div class="signal-box">
    <div class="signal-title">Сигнал нейросети</div>
    <div class="signal-main signal-wait" id="signalDisplay">ГОТОВ К АНАЛИЗУ</div>
  </div>

  <button class="btn-action" onclick="getSignal()">ПОЛУЧИТЬ ТОЧНЫЙ СИГНАЛ</button>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const canvas = document.getElementById('candleCanvas');
    const ctx = canvas.getContext('2d');
    let candles = [];
    let currentTF = '5M';

    function initCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    function generateCandles() {
      candles = [];
