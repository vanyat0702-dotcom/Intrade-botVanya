<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intrade Bar Pro Terminal & Signals</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Telegram WebApp API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cyber-border {
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.05);
        }
        .cyber-glow {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Верхняя панель навигации -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center cyber-border">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-cyan-400 cyber-glow">⚡ INTRADE BAR PRO ANALYZER</h1>
            <span class="text-xs bg-cyan-950 text-cyan-300 px-2.5 py-1 rounded border border-cyan-800">AI v5.0 Live</span>
        </div>
        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <select id="assetSelect" class="bg-slate-800 text-slate-200 text-sm rounded px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-cyan-500">
                <option value="EUR/USD">EUR/USD (Forex)</option>
                <option value="GBP/USD">GBP/USD (Forex)</option>
                <option value="USD/JPY">USD/JPY (Forex)</option>
                <option value="USD/CHF">USD/CHF (Forex)</option>
                <option value="USD/CAD">USD/CAD (Forex)</option>
                <option value="AUD/USD">AUD/USD (Forex)</option>
                <option value="NZD/USD">NZD/USD (Forex)</option>
                <option value="EUR/GBP">EUR/GBP (Forex)</option>
                <option value="EUR/JPY">EUR/JPY (Forex)</option>
                <option value="EUR/CHF">EUR/CHF (Forex)</option>
                <option value="EUR/CAD">EUR/CAD (Forex)</option>
                <option value="EUR/AUD">EUR/AUD (Forex)</option>
                <option value="GBP/JPY">GBP/JPY (Forex)</option>
                <option value="GBP/CHF">GBP/CHF (Forex)</option>
                <option value="GBP/CAD">GBP/CAD (Forex)</option>
                <option value="GBP/AUD">GBP/AUD (Forex)</option>
                <option value="AUD/JPY">AUD/JPY (Forex)</option>
                <option value="AUD/CAD">AUD/CAD (Forex)</option>
                <option value="NZD/JPY">NZD/JPY (Forex)</option>
                <option value="CHF/JPY">CHF/JPY (Forex)</option>
                <option value="CAD/JPY">CAD/JPY (Forex)</option>
            </select>
            <select id="timeframeSelect" class="bg-slate-800 text-slate-200 text-sm rounded px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-cyan-500">
                <option value="1m">M1 (1 минута)</option>
                <option value="5m">M5 (5 минут)</option>
                <option value="15m">M15 (Мульти-ТФ)</option>
            </select>
            <button id="toggleBotBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-1.5 rounded transition shadow-lg shadow-emerald-900/40">
                ▶ Запустить анализ
            </button>
        </div>
    </header>

    <!-- Основной рабочий контент -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-4 gap-4">
        
        <!-- Левая и центральная часть: Графики и Индикаторы (3 колонки) -->
        <div class="lg:col-span-3 flex flex-col space-y-4">
            
            <!-- Панель статусов и фильтров -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <div class="bg-slate-900/80 p-3 rounded-lg cyber-border">
                    <span class="text-xs text-slate-400 block">Глобальный Тренд (SMA 50)</span>
                    <span id="trendStatus" class="text-sm font-bold text-emerald-400">📈 Восходящий (CALL)</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-lg cyber-border">
                    <span class="text-xs text-slate-400 block">Новостной фильтр</span>
                    <span id="newsStatus" class="text-sm font-bold text-cyan-400">🛡️ Тихо (Без новостей)</span>
                </div>
                <div class="bg-slate-900/80 p-3 rounded-lg cyber-border">
                    <span class="text-xs text-slate-400 block">Рыночный паттерн</span>
                    <span id="pattern
